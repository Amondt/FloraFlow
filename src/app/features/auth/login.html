<main
  class="min-h-screen bg-neutral-50 dark:bg-neutral-900 flex items-center justify-center px-4"
  aria-labelledby="login-heading"
>
  <article
    class="w-full max-w-sm bg-white dark:bg-neutral-800 rounded-garden-lg shadow-sm border border-neutral-200 dark:border-neutral-700 p-8"
  >
    <header class="mb-6">
      <h1
        id="login-heading"
        class="text-2xl font-semibold font-display text-neutral-900 dark:text-white"
      >
        Sign in to FloraFlow
      </h1>
      <p class="mt-1 text-sm text-neutral-500 dark:text-neutral-400 font-display">
        Your smart gardening companion.
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate aria-label="Sign in form">
      <section aria-label="Credentials" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label
            for="flora-email"
            class="text-sm font-medium text-neutral-700 dark:text-neutral-200 font-display"
          >
            Email address
            <span aria-hidden="true" class="text-danger-500 ml-0.5">*</span>
            <span class="sr-only">(required)</span>
          </label>
          <input
            pInputText
            id="flora-email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            formControlName="email"
            [pt]="FloraInputTextPT"
            [class]="email.invalid && email.touched ? FLORA_ERROR : ''"
            [attr.aria-describedby]="email.invalid && email.touched ? 'flora-email-error' : null"
            [attr.aria-invalid]="email.invalid && email.touched"
            aria-required="true"
          />
          @if (email.invalid && email.touched) {
            <small id="flora-email-error" class="text-danger-500 text-xs font-display" role="alert">
              {{ emailError() }}
            </small>
          }
        </div>

        <div class="flex flex-col gap-1.5">
          <label
            for="flora-password"
            class="text-sm font-medium text-neutral-700 dark:text-neutral-200 font-display"
          >
            Password
            <span aria-hidden="true" class="text-danger-500 ml-0.5">*</span>
            <span class="sr-only">(required)</span>
          </label>
          <input
            pInputText
            id="flora-password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            formControlName="password"
            [pt]="FloraInputTextPT"
            [class]="password.invalid && password.touched ? FLORA_ERROR : ''"
            [attr.aria-describedby]="
              password.invalid && password.touched ? 'flora-password-error' : null
            "
            [attr.aria-invalid]="password.invalid && password.touched"
            aria-required="true"
          />
          @if (password.invalid && password.touched) {
            <small
              id="flora-password-error"
              class="text-danger-500 text-xs font-display"
              role="alert"
            >
              Password is required.
            </small>
          }
        </div>

        @if (authError()) {
          <div
            role="alert"
            class="px-4 py-3 rounded-garden-sm bg-red-50 dark:bg-danger-500/10 border border-danger-500 text-red-900 dark:text-danger-500 text-sm font-display"
          >
            {{ authError() }}
          </div>
        }

        <p-button
          type="submit"
          label="Sign in"
          [pt]="FloraButtonPT"
          [loading]="loading()"
          [disabled]="loading()"
          ariaLabel="Sign in to FloraFlow"
          class="w-full"
          styleClass="w-full justify-center"
        />
      </section>
    </form>
  </article>
</main>
