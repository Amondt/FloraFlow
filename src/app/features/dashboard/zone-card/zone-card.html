<article
  class="bg-white dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700 rounded-garden-md shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden"
  [attr.aria-labelledby]="headingId()"
>

  <header class="p-4 pb-0 flex items-start justify-between gap-2">
    <div class="flex-1 min-w-0">
      <h2
        [id]="headingId()"
        class="text-base font-semibold font-display text-neutral-900 dark:text-white truncate"
      >
        {{ zone().name }}
      </h2>
      <p class="text-xs uppercase tracking-wide font-display mt-0.5 text-neutral-400 dark:text-neutral-500">
        {{ zone().window_orientation }} window
      </p>
    </div>
    <span
      class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium font-display flex-shrink-0"
      [class]="isOverdue()
        ? 'bg-yellow-100 text-warning-500 dark:bg-yellow-900/30 dark:text-yellow-400'
        : 'bg-green-100 text-success-500 dark:bg-green-900/30 dark:text-green-400'"
    >
      <i
        class="text-xs"
        [class]="isOverdue() ? 'pi pi-exclamation-triangle' : 'pi pi-check'"
        aria-hidden="true"
      ></i>
      {{ statusLabel() }}
    </span>
  </header>

  <div class="p-4 flex items-start gap-4">

    <div class="flex-shrink-0" aria-hidden="true">
      <div class="relative w-20 h-20">
        <svg viewBox="0 0 80 80" class="w-full h-full" aria-hidden="true">
          <circle cx="40" cy="40" r="36" fill="none" stroke="#e2e8f0" stroke-width="1.5" class="dark:stroke-neutral-600" />
          <circle cx="40" cy="40" r="2" fill="#cbd5e1" class="dark:fill-neutral-500" />
          <line
            x1="40" y1="40"
            x2="40" y2="10"
            stroke="#94a3b8"
            stroke-width="1.5"
            stroke-linecap="round"
            [attr.transform]="'rotate(' + compassAngle() + ', 40, 40)'"
            class="dark:stroke-neutral-400"
          />
          <circle
            cx="40" cy="12"
            r="4"
            fill="#10b981"
            [attr.transform]="'rotate(' + compassAngle() + ', 40, 40)'"
          />
          <text x="40" y="7" text-anchor="middle" class="text-neutral-400" font-size="7" fill="#94a3b8" font-family="sans-serif">N</text>
          <text x="73" y="43" text-anchor="middle" font-size="7" fill="#94a3b8" font-family="sans-serif">E</text>
          <text x="40" y="78" text-anchor="middle" font-size="7" fill="#94a3b8" font-family="sans-serif">S</text>
          <text x="7" y="43" text-anchor="middle" font-size="7" fill="#94a3b8" font-family="sans-serif">W</text>
        </svg>
      </div>
    </div>

    <div class="flex-1 min-w-0 flex flex-col gap-3">

      <div>
        <p class="text-xs uppercase tracking-wide font-display text-neutral-400 dark:text-neutral-500 mb-1">Light</p>
        <p class="text-sm font-semibold font-display text-neutral-800 dark:text-neutral-100">
          {{ zone().window_orientation }}
        </p>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <p class="text-xs uppercase tracking-wide font-display text-neutral-400 dark:text-neutral-500">Humidity</p>
          <p class="text-xs font-semibold font-display text-neutral-700 dark:text-neutral-200">{{ zone().humidity_baseline }}%</p>
        </div>
        <div
          class="h-1.5 bg-neutral-200 dark:bg-neutral-600 rounded-full overflow-hidden"
          role="meter"
          [attr.aria-label]="'Humidity baseline ' + zone().humidity_baseline + '%'"
          [attr.aria-valuenow]="zone().humidity_baseline"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div
            class="h-full bg-primary-500 rounded-full transition-all duration-300"
            [style.width.%]="zone().humidity_baseline"
          ></div>
        </div>
      </div>

      <div class="flex items-center gap-2" aria-label="Active systems">
        <span
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium font-display border transition-colors"
          [class]="zone().has_grow_lights
            ? 'bg-primary-50 border-primary-200 text-primary-700 dark:bg-primary-900/30 dark:border-primary-800 dark:text-primary-300'
            : 'bg-neutral-100 border-neutral-200 text-neutral-500 dark:bg-neutral-700 dark:border-neutral-600 dark:text-neutral-400'"
          [attr.aria-label]="'Grow lights: ' + (zone().has_grow_lights ? 'active' : 'inactive')"
        >
          <i class="pi pi-sun text-xs" aria-hidden="true"></i>
          Grow light
        </span>
        <span
          class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium font-display border transition-colors"
          [class]="zone().has_active_ventilation
            ? 'bg-primary-50 border-primary-200 text-primary-700 dark:bg-primary-900/30 dark:border-primary-800 dark:text-primary-300'
            : 'bg-neutral-100 border-neutral-200 text-neutral-500 dark:bg-neutral-700 dark:border-neutral-600 dark:text-neutral-400'"
          [attr.aria-label]="'Ventilation: ' + (zone().has_active_ventilation ? 'active' : 'inactive')"
        >
          <i class="pi pi-send text-xs" aria-hidden="true"></i>
          Vent
        </span>
      </div>

    </div>
  </div>

  <footer class="px-4 pb-3 border-t border-neutral-100 dark:border-neutral-700 pt-3 flex items-center justify-between">
    <div class="flex-1 min-w-0">
      <p class="text-xs text-neutral-500 dark:text-neutral-400 font-display truncate">
        <span class="font-medium text-neutral-700 dark:text-neutral-200">{{ plantCount() }} {{ plantCount() === 1 ? 'plant' : 'plants' }}</span>
        @if (plantCount() > 0) {
          <span> · {{ plantSummary() }}</span>
        }
      </p>
    </div>
    <div class="flex items-center gap-1 flex-shrink-0 ml-2">
      <button
        type="button"
        class="text-xs font-medium font-display text-neutral-500 dark:text-neutral-400 hover:text-primary-600 dark:hover:text-primary-400 transition-colors px-2 py-1 rounded outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
        [attr.aria-label]="'Edit ' + zone().name + ' zone'"
        (click)="edit.emit(zone())"
      >
        Edit
      </button>
      <button
        type="button"
        class="text-xs font-medium font-display text-neutral-500 dark:text-neutral-400 hover:text-danger-500 dark:hover:text-danger-400 transition-colors px-2 py-1 rounded outline-none focus-visible:ring-2 focus-visible:ring-danger-500"
        [attr.aria-label]="'Delete ' + zone().name + ' zone'"
        (click)="remove.emit(zone().id)"
      >
        Delete
      </button>
    </div>
  </footer>

</article>
