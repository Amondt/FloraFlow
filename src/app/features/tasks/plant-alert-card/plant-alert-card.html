<article
  class="flex items-stretch rounded-garden-md border overflow-hidden transition-all duration-150 hover:border-primary-500 dark:hover:border-primary-400 active:opacity-70 focus-within:ring-2 focus-within:ring-primary-500 focus-within:ring-offset-2"
  [ngClass]="articleNgClass()"
  [attr.aria-labelledby]="headingId()"
>
  <button
    type="button"
    class="flex items-center gap-3 flex-1 min-w-0 px-4 py-2 text-left cursor-pointer outline-none"
    [attr.aria-label]="'tasks.alertCard.checkAriaLabel' | transloco: { name: plant().common_name }"
    (click)="checkNow.emit(plant())"
  >
    @if (thumbnailUrl()) {
      <img
        class="w-12 h-12 rounded-garden-sm object-cover flex-shrink-0"
        loading="lazy"
        [src]="thumbnailUrl()"
        [alt]="plant().common_name"
        aria-hidden="true"
      />
    } @else {
      <div
        class="w-12 h-12 rounded-garden-sm flex items-center justify-center flex-shrink-0 bg-primary-100 dark:bg-primary-900/30"
        aria-hidden="true"
      >
        <app-leaf-icon class="text-primary-600 dark:text-primary-400" />
      </div>
    }

    <div class="flex-1 min-w-0">
      <p
        [id]="headingId()"
        class="text-sm font-semibold font-display text-neutral-900 dark:text-white leading-snug"
      >
        {{ plant().common_name }}
        @if (plant().scientific_name) {
          <span class="font-normal italic text-neutral-400 dark:text-neutral-500">
            · {{ plant().scientific_name }}</span
          >
        }
      </p>
      @if (zoneName()) {
        <p class="text-xs text-neutral-400 dark:text-neutral-500 font-display mt-0.5 truncate">
          {{ zoneName() }}
        </p>
      }
    </div>

    <span [class]="badgeColor()">
      <span
        class="w-1.5 h-1.5 rounded-full flex-shrink-0"
        [class]="dotColor()"
        aria-hidden="true"
      ></span>
      {{ overdueLabel() }}
    </span>
  </button>

  <button
    type="button"
    class="relative px-3 py-3 flex items-center border-l cursor-pointer text-neutral-400 dark:text-neutral-500 hover:text-primary-600 dark:hover:text-primary-400 hover:bg-primary-50 dark:hover:bg-primary-900/20 transition-colors outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-500"
    [ngClass]="editBorderNgClass()"
    [attr.aria-label]="'tasks.alertCard.editAriaLabel' | transloco: { name: plant().common_name }"
    (click)="edit.emit(plant())"
  >
    <span
      aria-hidden="true"
      class="absolute top-1/2 left-1/2 size-11 -translate-x-1/2 -translate-y-1/2 pointer-fine:hidden"
    ></span>
    <i class="pi pi-pencil text-sm" aria-hidden="true"></i>
  </button>

  <button
    type="button"
    class="relative px-3 py-3 flex items-center border-l cursor-pointer text-neutral-400 dark:text-neutral-500 hover:text-danger-500 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-danger-500"
    [ngClass]="editBorderNgClass()"
    [attr.aria-label]="'tasks.alertCard.deleteAriaLabel' | transloco: { name: plant().common_name }"
    (click)="deleteRequested.emit(plant())"
  >
    <span
      aria-hidden="true"
      class="absolute top-1/2 left-1/2 size-11 -translate-x-1/2 -translate-y-1/2 pointer-fine:hidden"
    ></span>
    <i class="pi pi-trash text-sm" aria-hidden="true"></i>
  </button>
</article>
