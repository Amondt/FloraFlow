<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="dialogTitle()"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [pt]="FloraDialogPT"
  (onHide)="onHide()"
>
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
    class="flex flex-col gap-5"
    aria-label="Zone details form"
  >
    <app-zone-form-fields [form]="form" />
  </form>

  <ng-template #footer>
    <p-button
      label="Cancel"
      variant="text"
      [pt]="FloraButtonPT"
      ariaLabel="Cancel and close dialog"
      (onClick)="onCancel()"
    />
    <p-button
      label="Save zone"
      [pt]="FloraButtonPT"
      ariaLabel="Save zone details"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
