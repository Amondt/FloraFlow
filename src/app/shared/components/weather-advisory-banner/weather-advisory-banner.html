<section
  role="alert"
  aria-live="assertive"
  [attr.aria-label]="ariaLabel()"
  class="flex items-start gap-3 bg-amber-50 dark:bg-yellow-900/20 border border-warning-500 dark:border-yellow-700/50 rounded-garden-md p-4 mb-6"
>
  <i [class]="'pi ' + icon() + ' text-warning-500 mt-0.5 flex-shrink-0'" aria-hidden="true"></i>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-semibold font-display text-warning-500">{{ heading() }}</p>
    <p class="text-sm font-display text-neutral-600 dark:text-neutral-300 mt-0.5">{{ body() }}</p>
  </div>
</section>
