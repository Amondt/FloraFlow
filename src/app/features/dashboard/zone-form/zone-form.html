<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [header]="dialogTitle() | transloco"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [pt]="FloraDialogPT"
  (onHide)="onHide()"
>
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    novalidate
    class="flex flex-col gap-5"
    [attr.aria-label]="'zones.form.formAriaLabel' | transloco"
  >
    <app-zone-form-fields [form]="form" />
  </form>

  <ng-template #footer>
    <p-button
      [label]="'zones.form.cancel' | transloco"
      variant="text"
      [pt]="FloraButtonPT"
      [ariaLabel]="'zones.form.cancelAriaLabel' | transloco"
      (onClick)="onCancel()"
    />
    <p-button
      [label]="'zones.form.save' | transloco"
      [pt]="FloraButtonPT"
      [ariaLabel]="'zones.form.saveAriaLabel' | transloco"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
