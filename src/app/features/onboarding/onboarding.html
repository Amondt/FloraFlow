<main class="min-h-screen flex items-center justify-center bg-neutral-50" aria-label="Onboarding">
  <section class="flex flex-col gap-6 p-10 bg-white rounded-garden-lg shadow-sm max-w-md w-full">
    <h1 class="text-2xl font-semibold text-neutral-900">Welcome to FloraFlow</h1>
    <p class="text-neutral-600 text-sm">Setting up your greenhouse experience…</p>
    <button
      type="button"
      class="h-control px-6 rounded-garden-md bg-primary-500 text-white text-sm font-medium hover:bg-primary-600 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-500"
      aria-label="Complete onboarding and enter dashboard"
      (click)="complete()"
    >
      Complete Onboarding
    </button>
  </section>
</main>
