<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloraFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- App fonts: Inter (UI) + JetBrains Mono (mono accents). preconnect warms the
         connection before the CSS request; display=swap avoids invisible-text flash. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap"
    />
    <!-- ?v=2 cache-busts the browser's favicon cache, which persists independently of normal
         page/HTTP caching and often survives a hard reload — bump this if the mark changes again. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      (function () {
        var t = localStorage.getItem('flora-theme');
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
