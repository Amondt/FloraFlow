<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloraFlow</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- ?v=2 cache-busts the browser's favicon cache, which persists independently of normal
         page/HTTP caching and often survives a hard reload — bump this if the mark changes again. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      (function () {
        var t = localStorage.getItem('flora-theme');
        var dark =
          t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
